<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDB Report Console</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark">kdb+</span>
    <h1>Report Console</h1>
  </div>
  <div class="status" id="health" title="Backend status">
    <span class="dot" id="health-dot"></span>
    <span id="health-text">connecting&hellip;</span>
  </div>
</header>

<!-- ---------- one control module: pick a report AND configure it ---------- -->
<form class="controls" id="param-form" autocomplete="off">
  <div class="row">
    <div class="sel">
      <label for="category">Category</label>
      <select id="category" aria-label="Report category"></select>
    </div>
    <div class="sel grow">
      <label for="report-select">Report</label>
      <select id="report-select" aria-label="Report"></select>
    </div>
    <div class="sel search">
      <label for="search">Search</label>
      <div class="search-box">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 1-3.9 9.4 5.5 5.5 0 0 1 3.9-9.4Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm4.6 7.7 4 4-1.1 1.1-4-4Z"/></svg>
        <input id="search" type="search" placeholder="filter reports&hellip;"
               autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <p class="report-desc" id="report-desc"></p>

  <div class="row params" id="param-row">
    <div id="param-fields" class="fields"></div>
    <div class="field" id="format-field"></div>
    <div class="actions">
      <button type="submit" id="run-btn" class="primary">Run report</button>
      <button type="button" id="reset-btn" class="ghost">Reset</button>
      <span class="spinner hidden" id="spinner" aria-hidden="true"></span>
    </div>
  </div>
</form>

<!-- ---------- results take everything below ---------- -->
<main class="layout">
  <section class="panel results">
    <div id="banner" class="banner hidden" role="alert"></div>
    <div id="result-meta" class="result-meta hidden"></div>
    <div id="result" class="result">
      <div class="empty"><p>Choose a report above and run it.</p></div>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
